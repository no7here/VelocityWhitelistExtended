plugins {
    id 'java'
}

group = 'me.fallenbreath'
version = project.plugin_version

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

def generateVersion = tasks.register('generateVersion') {
    def outputDir = layout.buildDirectory.dir("generated/sources/version/me/fallenbreath/velocitywhitelist")
    def outputFile = outputDir.map { it.file("BuildInfo.java") }
    inputs.property("version", project.plugin_version)
    outputs.file(outputFile)
    doLast {
        def file = outputFile.get().asFile
        file.parentFile.mkdirs()
        file.text = """package me.fallenbreath.velocitywhitelist;

public class BuildInfo {
    public static final String VERSION = "${project.plugin_version}";
}
"""
    }
}
sourceSets.main.java.srcDir(layout.buildDirectory.dir("generated/sources/version"))
compileJava.dependsOn(generateVersion)

dependencies {
    compileOnly "com.velocitypowered:velocity-api:${project.velocity_api_version}"
    annotationProcessor "com.velocitypowered:velocity-api:${project.velocity_api_version}"

    testImplementation "com.velocitypowered:velocity-api:${project.velocity_api_version}"
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.12'
}

test {
    useJUnitPlatform()
    // Fixed port (rather than an ephemeral one) so the value is known before the JVM starts:
    // MojangAPI caches this into a `static final` field at class-init time, so the property
    // must be set before that class is first touched, not from within a running test.
    systemProperty 'velocitywhitelist.mojang.accountserver', 'http://127.0.0.1:18765/users/profiles/minecraft/'
}
